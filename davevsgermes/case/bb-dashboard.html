<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cypress Coast Comfort · Money dashboard</title>
<style>
.viz-root{
  color-scheme: light;
  --page:#f9f9f7; --surface-1:#fcfcfb; --surface-2:#f3f2ee;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100; --series-5:#e87ba4;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b; --good-text:#006300;
  --accent-wash:rgba(42,120,214,0.08);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])) .viz-root{
    color-scheme: dark;
    --page:#0d0d0d; --surface-1:#1a1a19; --surface-2:#232321;
    --text-primary:#f0efec; --text-secondary:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181;
    --good-text:#0ca30c; --accent-wash:rgba(57,135,229,0.12);
  }
}
:root[data-theme="dark"] .viz-root{
    color-scheme: dark;
    --page:#0d0d0d; --surface-1:#1a1a19; --surface-2:#232321;
    --text-primary:#f0efec; --text-secondary:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181;
    --good-text:#0ca30c; --accent-wash:rgba(57,135,229,0.12);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
.viz-root{background:var(--page);color:var(--text-primary);font-size:14px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding:20px 24px 60px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
header.top h1{font-size:20px;margin:0;font-weight:650;letter-spacing:-.01em}
header.top .sub{color:var(--text-secondary);font-size:13px}
.theme-btn{border:1px solid var(--border);background:var(--surface-1);color:var(--text-secondary);border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--grid);margin-bottom:20px;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font:inherit;color:var(--text-secondary);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--text-primary);border-bottom-color:var(--series-1);font-weight:600}
nav.tabs button .count{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--surface-2);font-size:11px;color:var(--text-secondary)}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:18px 20px}
.card h2{font-size:15px;margin:0 0 4px;font-weight:600}
.card .hint{color:var(--text-secondary);font-size:12.5px;margin:0 0 14px}
.grid{display:grid;gap:16px}
.g-hero{grid-template-columns:1.25fr 1fr 1fr 1fr}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
@media (max-width:980px){.g-hero,.g2,.g3{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.g-hero,.g2,.g3{grid-template-columns:1fr}}
.tile{cursor:pointer;transition:background .12s}
.tile:hover{background:var(--surface-2)}
.tile .lbl{color:var(--text-secondary);font-size:12.5px}
.tile .val{font-size:28px;font-weight:600;margin:4px 0 2px;letter-spacing:-.01em}
.tile.hero .val{font-size:48px;line-height:1.05}
.tile .foot{color:var(--text-secondary);font-size:12.5px}
.tile .foot b{color:var(--text-primary);font-weight:600}
.caveat{font-size:12px;color:var(--muted);margin-top:8px}
/* status pills: icon + label, never color alone */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--text-secondary);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.st-completed .dot{background:var(--good)} .st-booked .dot{background:var(--series-1)}
.st-pipeline .dot{background:var(--muted)} .st-cancelled .dot{background:var(--critical)}
.flag{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--surface-2);margin-bottom:8px;font-size:13px}
.flag .ic{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.flag.crit .ic{background:var(--critical)} .flag.warn .ic{background:var(--warning);color:#0b0b0b}
.flag.act .ic{background:var(--series-1)} .flag.good .ic{background:var(--good)} .flag.info .ic{background:var(--muted)}
.flag .tag{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-secondary);font-weight:600;margin-right:6px}
/* tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:500;color:var(--text-secondary);text-align:left;padding:8px 10px;border-bottom:1px solid var(--grid);font-size:12px;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-wash)}
tfoot td{font-weight:600;border-bottom:0;border-top:1px solid var(--axis)}
.small{font-size:12px;color:var(--text-secondary)}
.pos{color:var(--good-text)} .neg{color:var(--critical)}
/* stacked bars */
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:0 0 12px;font-size:12px;color:var(--text-secondary)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:10px;border-radius:2px;display:inline-block}
.bars{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:230px 1fr 130px;align-items:center;gap:12px;padding:4px 6px;border-radius:8px;cursor:pointer}
.brow:hover,.brow:focus-visible{background:var(--accent-wash);outline:none}
.brow .name{font-size:13px;line-height:1.25}
.brow .name small{display:block;color:var(--text-secondary);font-size:11.5px}
.track{position:relative;height:18px}
.stack{display:flex;height:18px;gap:2px}
.seg{height:100%;min-width:2px}
.seg:first-child{border-radius:0} .seg:last-child{border-radius:0 4px 4px 0}
.seg:hover{filter:brightness(1.12)}
.brow .val{font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.brow .val small{display:block;color:var(--text-secondary);font-size:11.5px}
.axisrow{display:grid;grid-template-columns:230px 1fr 130px;gap:12px;padding:0 6px}
.axis{position:relative;height:18px;border-top:1px solid var(--axis);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.axis span{position:absolute;top:3px;transform:translateX(-50%)}
.groupH{font-size:12px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em;margin:14px 6px 4px}
/* segmented money bar */
.segbar{display:flex;gap:2px;height:28px;margin:6px 0 10px}
.segbar div{border-radius:4px;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;padding-left:8px;white-space:nowrap;overflow:visible;min-width:2px}
#tip{position:fixed;pointer-events:none;z-index:50;background:var(--surface-1);border:1px solid var(--border);box-shadow:0 6px 24px rgba(0,0,0,.14);border-radius:8px;padding:8px 10px;font-size:12px;max-width:300px;display:none}
#tip b{font-size:14px;display:block;color:var(--text-primary);font-variant-numeric:tabular-nums}
#tip .k{display:inline-block;width:12px;height:2px;vertical-align:middle;margin-right:6px}
#tip .s{color:var(--text-secondary)}
/* drawer */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);display:none;z-index:30}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface-1);border-left:1px solid var(--border);z-index:40;overflow:auto;transform:translateX(100%);transition:transform .2s ease;padding:22px 24px 40px}
#drawer.open{transform:none} #scrim.open{display:block}
#drawer h3{margin:0;font-size:19px}
#drawer .close{position:sticky;top:0;float:right;border:1px solid var(--border);background:var(--surface-1);color:var(--text-primary);border-radius:8px;padding:4px 10px;cursor:pointer;font:inherit}
#drawer h4{font-size:13px;margin:22px 0 8px;color:var(--text-secondary);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.kv div{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.kv span{display:block;font-size:12px;color:var(--text-secondary)}
.kv b{font-size:18px;font-weight:600}
.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters button{border:1px solid var(--border);background:var(--surface-1);color:var(--text-secondary);border-radius:999px;padding:5px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--text-primary);color:var(--surface-1);border-color:var(--text-primary)}
.idea{display:grid;grid-template-columns:110px 1fr 110px;gap:14px;padding:14px 4px;border-bottom:1px solid var(--grid)}
.idea:last-child{border-bottom:0}
.idea .area{font-size:12px;color:var(--text-secondary)}
.idea h5{margin:0 0 4px;font-size:14px}
.idea p{margin:0;color:var(--text-secondary);font-size:13px}
.idea .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.idea .v small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.order{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px;background:var(--surface-1)}
.order .oh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.order .oh b{font-size:14px}
.chk{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--text-secondary);margin-top:8px}
.srcs{font-size:12px;color:var(--text-secondary)}
.srcs li{margin-bottom:4px}
a{color:var(--series-1)}
.tableview{margin-top:10px}
.tableview summary{cursor:pointer;color:var(--text-secondary);font-size:12.5px}
</style>
</head>
<body>
<div class="viz-root">
<div class="wrap">
  <header class="top">
    <div>
      <h1>Cypress Coast Comfort · Money dashboard</h1>
      <div class="sub" id="asof"></div>
    </div>
    <button class="theme-btn" id="themeBtn" type="button">Theme: auto</button>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
</div>
<div id="tip" role="tooltip"></div>
<div id="scrim"></div>
<aside id="drawer" aria-label="Job details" aria-hidden="true"></aside>
</div>

      body: "This week a wrong delivery window ($185) and a rattling cover callback ($150) cost $335, about a fifth of a typical job's gross profit. Check the access window on every dispatch note and the cover fixings at commissioning.", src: "SL-772, PC-613" },

      body: "7 open jobs have blank equipment costs and the Reed price is out of date, so Dispatchlark can't show profit. Callbacks and re-deliveries aren't recorded against jobs, so finished-job margins look better than they are.", src: "DL job pages, Reports" },

</script>
<script>
(() => {
const D = window.CCC;
const $ = (s, r=document) => r.querySelector(s);
const el = (tag, attrs={}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k === 'style') n.setAttribute('style', v);
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
};
const money = (v, d=0) => (v < 0 ? '−' : '') + '$' + Math.abs(v).toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});
const money2 = v => money(v, 2);
const pct = v => (v*100).toFixed(1) + '%';
const sum = (a, f=x=>x) => a.reduce((s,x)=>s+f(x),0);
const catColor = k => `var(--series-${D.cats.find(c=>c.key===k).slot})`;
const stageLabel = {completed:'Completed', booked:'Booked', pipeline:'Quoted / lead', cancelled:'Cancelled'};

// ---------- derived job economics ----------
D.jobs.forEach(j => {
  j.cost = Math.round(sum(j.lines, l=>l.amt)*100)/100;
  j.gp = j.price - j.cost;
  j.margin = j.price ? j.gp / j.price : null;
  j.byCat = {};
  D.cats.forEach(c => j.byCat[c.key] = 0);
  j.lines.forEach(l => j.byCat[l.cat] += l.amt);
  j.byCat.profit = Math.max(j.gp, 0);
  j.balance = j.stage === 'cancelled' ? 0 : Math.max(j.price - j.received, 0);
});
const jobsBy = s => D.jobs.filter(j => j.stage === s && j.price > 0);
const completed = jobsBy('completed'), booked = jobsBy('booked'), pipeline = jobsBy('pipeline');
const agg = arr => ({ rev: sum(arr,j=>j.price), cost: sum(arr,j=>j.cost), gp: sum(arr,j=>j.gp) });
const A = { done: agg(completed), booked: agg(booked), pipe: agg(pipeline) };
A.both = { rev: A.done.rev + A.booked.rev, gp: A.done.gp + A.booked.gp };
const AR = sum(D.receivables, r=>r.amt);
const AP = sum(D.payables, p=>p.amt);
const ordersNow = D.orders.filter(o=>o.status==='order');
const ordersPlaced = D.orders.filter(o=>o.status==='placed');
const ordersPlacedTotal = sum(ordersPlaced, o=>sum(o.items, i=>i.qty*i.unit));
const ordersNowTotal = sum(ordersNow, o=>sum(o.items, i=>i.qty*i.unit));
const actionFlags = D.jobs.flatMap(j => j.flags.filter(f => f.lvl==='crit' || f.lvl==='act').map(f => ({...f, job:j})));

// ---------- tooltip ----------
const tip = $('#tip');
function showTip(ev, value, label, sub, color){
  tip.replaceChildren();
  const b = el('b', {}, value); tip.append(b);
  const l = el('div', {}, color ? el('span', {class:'k', style:`background:${color}`}) : null, label); tip.append(l);
  if (sub) tip.append(el('div', {class:'s'}, sub));
  tip.style.display = 'block';
  moveTip(ev);
}
function moveTip(ev){
  let x, y;
  if (ev.clientX !== undefined && ev.type !== 'focus') { x = ev.clientX; y = ev.clientY; }
  else { const r = ev.target.getBoundingClientRect(); x = r.left + r.width/2; y = r.top; }
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(window.innerWidth - w - 8, x + 14) + 'px';
  tip.style.top = Math.max(8, y - h - 10) + 'px';
}
const hideTip = () => tip.style.display = 'none';

// ---------- tabs ----------
const TABS = [
  { id:'overview', label:'Overview' },
  { id:'mylist', label:'My list', count: D.myList.length },
  { id:'jobs', label:'Job profit' },
  { id:'money', label:'Owed to us / We owe' },
  { id:'crm', label:'HubSpot deals', count: D.hubspot.deals.filter(x=>!x.ok).length },
  { id:'orders', label:'Supplier orders' },
  { id:'improve', label:'Improvements', count: D.ideas.length },
  { id:'prices', label:'Minimum prices' },
  { id:'fixes', label:'Record fixes' },
];
let current = location.hash.slice(1) || 'overview';
function renderTabs(){
  const nav = $('#tabs'); nav.replaceChildren();
  TABS.forEach(t => nav.append(el('button', {role:'tab', 'aria-selected': String(t.id===current), onclick:()=>go(t.id)}, t.label, t.count ? el('span',{class:'count'}, t.count) : null)));
}
function go(id){ current = id; try{history.replaceState(null,'','#'+id);}catch(e){} renderTabs(); render(); window.scrollTo({top:0}); }

// ---------- shared pieces ----------
function legend(keys = D.cats.map(c=>c.key)){
  return el('div', {class:'legend'}, keys.map(k => el('span', {}, el('i', {style:`background:${catColor(k)}`}), D.cats.find(c=>c.key===k).label)));
}
function flagNode(f, withJob){
  const icon = {crit:'!', warn:'!', act:'→', good:'✓', info:'i'}[f.lvl];
  const tag = {crit:'Critical', warn:'Watch', act:'Action', good:'OK', info:'Note'}[f.lvl];
  const kids = [el('span',{class:'ic','aria-hidden':'true'}, icon), el('div', {}, el('span',{class:'tag'}, tag), withJob ? el('b', {}, `${f.job.customer} · ${f.job.site.split(' / ')[0]}: `) : null, f.t)];
  const n = el('div', {class:'flag '+f.lvl}, ...kids);
  if (withJob) { n.style.cursor = 'pointer'; n.addEventListener('click', () => openJob(f.job.id)); }
  return n;
}
function statusPill(j){ return el('span', {class:'pill st-'+j.stage}, el('span',{class:'dot','aria-hidden':'true'}), stageLabel[j.stage]); }

function jobBars(list, scaleMax){
  const wrap = el('div', {class:'bars'});
  const ticks = [];
  const step = scaleMax > 5000 ? 1000 : 500;
  for (let v=0; v<=scaleMax; v+=step) ticks.push(v);
  list.forEach(j => {
    const stack = el('div', {class:'stack'});
    const order = ['equip','crew','mat','extra','profit'];
    order.forEach(k => {
      const v = j.byCat[k]; if (!v) return;
      const seg = el('div', {class:'seg', style:`width:${(v/scaleMax*100).toFixed(3)}%;background:${catColor(k)}`});
      const label = D.cats.find(c=>c.key===k).label;
      seg.addEventListener('pointermove', ev => showTip(ev, money2(v), label, `${j.customer} · ${j.site.split(' / ')[0]} · ${pct(v/j.price)} of price`, catColor(k)));
      seg.addEventListener('pointerleave', hideTip);
      stack.append(seg);
    });
    // a negative profit is shown as cost exceeding price: price marker
    const row = el('div', {class:'brow', tabindex:'0', role:'button', 'aria-label': `${j.customer}, ${j.site}: price ${money(j.price)}, gross profit ${money2(j.gp)}, margin ${pct(j.margin)}. Open details.`,
      onclick:()=>openJob(j.id), onkeydown:e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();openJob(j.id);} }},
      el('div', {class:'name'}, `${j.customer}`, el('small', {}, `${j.id} · ${j.site.split(' / ')[0]}`)),
      el('div', {class:'track'}, stack),
      el('div', {class:'val'}, money(j.gp), el('small', {}, `${pct(j.margin)} of ${money(j.price)}`)));
    wrap.append(row);
  });
  const axis = el('div', {class:'axis'});
  ticks.forEach(t => axis.append(el('span', {style:`left:${t/scaleMax*100}%`}, t>=1000 ? (t/1000)+'K' : t)));
  wrap.append(el('div', {class:'axisrow'}, el('div'), axis, el('div', {class:'small', style:'text-align:right'}, 'Gross profit')));
  return wrap;
}

// ---------- views ----------
function viewOverview(){
  const v = el('div', {class:'grid', style:'gap:18px'});
  const t = (cls, lbl, val, foot, go_) => el('div', {class:'card tile '+cls, tabindex:'0', role:'button', onclick:()=>go(go_), onkeydown:e=>{if(e.key==='Enter')go(go_);}}, el('div',{class:'lbl'},lbl), el('div',{class:'val'},val), el('div',{class:'foot'},...foot));
  v.append(el('div', {class:'grid g-hero'},
    t('hero', 'Gross profit on finished + booked jobs', money(A.both.gp), [el('b',{},pct(A.both.gp/A.both.rev)), ` of ${money(A.both.rev)} in sales · ${completed.length} finished, ${booked.length} booked`], 'jobs'),
    t('', 'Owed to us', money(AR), [ 'Balances due as jobs finish. ', el('b',{},'$450'), ' of it has no payment arranged'], 'money'),
    t('', 'We owe', money2(AP), [ 'Galloway-Hale ', el('b',{},money2(D.ghAccount.open)), ' · Ben Foster refund ', el('b',{},'$1,200')], 'money'),
    t('', 'Ordered today', money2(ordersPlacedTotal), [ el('b',{},'Dunedin + St. Pete'), ' for pickup Mon Nov 16 · Reed stand waits on Luis’s sign-off'], 'orders'),
  ));
  v.append(el('div', {class:'caveat'}, 'Job profit is the selling price before tax minus direct job costs (equipment, crew, materials, permit, extras, financing fees). Rent, insurance, van finance and owner pay aren’t included, so this isn’t company net profit.'));

  const left = el('div', {class:'card'},
    el('h2', {}, 'Needs a decision'),
    el('p', {class:'hint'}, 'From all the systems combined. Click an item to open its job.'),
    ...actionFlags.sort((a,b)=> (a.lvl==='crit'?0:1)-(b.lvl==='crit'?0:1)).slice(0,8).map(f => flagNode(f, true)));
  const top = D.jobs.filter(j=>j.price>0 && j.stage!=='cancelled').sort((a,b)=>a.margin-b.margin);
  const right = el('div', {class:'card'},
    el('h2', {}, 'Profit per job (finished + booked)'),
    el('p', {class:'hint'}, 'Each bar is the job’s selling price, split into what it costs and what’s left. Hover a segment for its amount; click a row to see the details.'),
    legend(['equip','crew','mat','extra','profit']),
    jobBars([...completed, ...booked].sort((a,b)=>b.price-a.price), 6500));
  v.append(el('div', {class:'grid g2'}, right, left));

  // pipeline strip
  const p = el('div', {class:'card'}, el('h2', {}, 'Pipeline'), el('p',{class:'hint'}, 'Quoted but not won yet, including corrected costs.'));
  const tb = el('table', {}, el('thead', {}, el('tr', {}, el('th',{},'Customer'), el('th',{},'Status'), el('th',{class:'num'},'Quoted'), el('th',{class:'num'},'Est. gross profit'), el('th',{class:'num'},'Margin'))));
  const body = el('tbody');
  D.jobs.filter(j=>j.stage==='pipeline').forEach(j => body.append(el('tr', {class:'click', onclick:()=>openJob(j.id)},
    el('td', {}, j.customer, el('div',{class:'small'}, j.site)), el('td', {}, j.status),
    el('td', {class:'num'}, j.price ? money(j.price) : '—'), el('td', {class:'num'}, j.price ? money2(j.gp) : '—'), el('td', {class:'num'}, j.price ? pct(j.margin) : '—'))));
  tb.append(body); p.append(tb);
  v.append(p);
  return v;
}

function viewJobs(){
  const v = el('div', {class:'grid', style:'gap:18px'});
  let filter = window.__jobFilter || 'all';
  const filters = el('div', {class:'filters'});
  const opts = [['all','All jobs'],['completed','Finished'],['booked','Booked'],['pipeline','Quoted / leads'],['cancelled','Cancelled']];
  opts.forEach(([k,l]) => filters.append(el('button', {'aria-pressed': String(filter===k), onclick:()=>{window.__jobFilter=k; render();}}, l)));
  v.append(filters);

  const list = D.jobs.filter(j => filter==='all' || j.stage===filter);
  const chartJobs = list.filter(j => j.price > 0);
  const totals = agg(chartJobs);
  v.append(el('div', {class:'grid g3'},
    el('div', {class:'card'}, el('div',{class:'small'},'Sales (before tax)'), el('div',{style:'font-size:26px;font-weight:600'}, money(totals.rev))),
    el('div', {class:'card'}, el('div',{class:'small'},'Direct job costs'), el('div',{style:'font-size:26px;font-weight:600'}, money2(totals.cost))),
    el('div', {class:'card'}, el('div',{class:'small'},'Gross profit'), el('div',{style:'font-size:26px;font-weight:600'}, money2(totals.gp)), el('div',{class:'small'}, totals.rev ? pct(totals.gp/totals.rev)+' margin' : ''))));

  if (chartJobs.length){
    const c = el('div', {class:'card'}, el('h2',{},'Where each job’s money goes'), el('p',{class:'hint'},'Bar length is the selling price. Click a row for the line-by-line breakdown and sources.'), legend(['equip','crew','mat','extra','profit']));
    const groups = ['completed','booked','pipeline'].filter(s => chartJobs.some(j=>j.stage===s));
    groups.forEach(s => { c.append(el('div',{class:'groupH'}, stageLabel[s])); c.append(jobBars(chartJobs.filter(j=>j.stage===s).sort((a,b)=>b.price-a.price), 6500)); });
    v.append(c);
  }

  const card = el('div', {class:'card'}, el('h2',{},'All jobs'), el('p',{class:'hint'},'Click any row for details.'));
  const tb = el('table', {}, el('thead',{}, el('tr',{}, ...['Job','Customer / site','Status','Price','Costs','Gross profit','Margin','Paid','Balance'].map((h,i)=>el('th',{class:i>=3?'num':''},h)))));
  const body = el('tbody');
  list.forEach(j => body.append(el('tr', {class:'click', onclick:()=>openJob(j.id)},
    el('td', {}, j.id, el('div',{class:'small'}, 'DL #'+j.dl)),
    el('td', {}, j.customer, j.company ? el('span',{class:'small'}, ' · '+j.company) : null, el('div',{class:'small'}, j.site)),
    el('td', {}, statusPill(j), el('div',{class:'small', style:'margin-top:4px'}, j.status)),
    el('td', {class:'num'}, j.price ? money(j.price) : '—'),
    el('td', {class:'num'}, j.lines.length ? money2(j.cost) : '—'),
    el('td', {class:'num'}, j.price ? money2(j.gp) : '—'),
    el('td', {class:'num'}, j.price ? pct(j.margin) : '—'),
    el('td', {class:'num'}, money(j.received)),
    el('td', {class:'num'}, j.stage==='cancelled' ? el('span',{class:'neg'}, 'refund '+money(j.received)) : (j.stage==='pipeline' ? '—' : money(j.balance))))));
  tb.append(body); card.append(tb); v.append(card);
  return v;
}

function viewMoney(){
  const v = el('div', {class:'grid', style:'gap:18px'});
  // segmented bars
  const segbar = (parts) => {
    const tot = sum(parts, p=>p.v);
    const b = el('div', {class:'segbar', role:'img', 'aria-label': parts.map(p=>`${p.l} ${money2(p.v)}`).join(', ')});
    parts.forEach(p => {
      const w = p.v/tot*100;
      const d = el('div', {style:`flex:0 0 calc(${w}% - 2px);background:${p.c};${p.dark?'color:#0b0b0b':''}`, tabindex:'0'}, w > 16 ? money(p.v) : '');
      d.addEventListener('pointermove', ev=>showTip(ev, money2(p.v), p.l, `${pct(p.v/tot)} of ${money2(tot)}`, p.c));
      d.addEventListener('focus', ev=>showTip(ev, money2(p.v), p.l, `${pct(p.v/tot)} of ${money2(tot)}`, p.c));
      d.addEventListener('pointerleave', hideTip); d.addEventListener('blur', hideTip);
      b.append(d);
    });
    return b;
  };
  const arParts = [
    {l:'Ava Chen / Bayside (3 sites)', v:6950, c:'var(--series-1)'},
    {l:'Marcus Reed via Homeleaf', v:1550, c:'var(--series-3)'},
    {l:'Marcus Reed: not arranged', v:450, c:'var(--series-4)', dark:true},
  ];
  const apParts = [
    {l:'Galloway-Hale Supply', v:D.ghAccount.open, c:'var(--series-2)'},
    {l:'Ben Foster deposit refund', v:1200, c:'var(--series-5)'},
    {l:'Sunline Local Delivery', v:185, c:'var(--series-4)', dark:true},
  ];
  const lg = parts => el('div', {class:'legend'}, parts.map(p => el('span',{}, el('i',{style:`background:${p.c}`}), p.l)));

  const arCard = el('div', {class:'card'}, el('h2',{},'Who owes us'), el('p',{class:'hint'}, `${money(AR)} in contract balances. Nothing is overdue: each balance falls due when its job is finished (Dispatchlark shows $0 unpaid on issued invoices).`), segbar(arParts), lg(arParts));
  const t1 = el('table', {}, el('thead',{}, el('tr',{}, el('th',{},'Customer'), el('th',{},'For'), el('th',{},'When'), el('th',{class:'num'},'Amount'))));
  const b1 = el('tbody');
  D.receivables.forEach(r => b1.append(el('tr', {class:'click', onclick:()=>openJob(r.job)}, el('td',{}, r.who, el('div',{class:'small'}, r.job)), el('td',{}, r.what, r.warn ? el('div',{class:'small neg'}, '⚠ needs arranging') : null), el('td',{class:'small'}, r.due), el('td',{class:'num'}, money2(r.amt)))));
  t1.append(b1, el('tfoot',{}, el('tr',{}, el('td',{colspan:'3'},'Total'), el('td',{class:'num'}, money2(AR)))));
  arCard.append(t1);

  const apCard = el('div', {class:'card'}, el('h2',{},'Who we owe'), el('p',{class:'hint'}, `${money2(AP)} in bills and refunds. Paying Galloway-Hale by Dec 10 takes 1% off.`), segbar(apParts), lg(apParts));
  const t2 = el('table', {}, el('thead',{}, el('tr',{}, el('th',{},'To'), el('th',{},'For'), el('th',{},'Due'), el('th',{class:'num'},'Amount'))));
  const b2 = el('tbody');
  D.payables.forEach(p => b2.append(el('tr', {class:'click', onclick:()=>openJob(p.job)}, el('td',{}, p.who, el('div',{class:'small'}, p.ref)), el('td',{}, p.what, el('div',{class:'small'}, p.job)), el('td',{class:'small'}, p.due), el('td',{class:'num'}, money2(p.amt)))));
  t2.append(b2, el('tfoot',{}, el('tr',{}, el('td',{colspan:'3'},'Total'), el('td',{class:'num'}, money2(AP)))));
  apCard.append(t2);
  v.append(el('div', {class:'grid g2'}, arCard, apCard));

  // crew + commitments
  const crew = el('div', {class:'card'}, el('h2',{},'Palmetto crew charges on finished work'), el('p',{class:'hint'}, 'These are incurred, but none of the files or systems record whether they’ve been paid. Check them against Palmetto’s statements.'));

function openJob(id){
  const j = D.jobs.find(x=>x.id===id); if (!j) return;
  const d = $('#drawer'); d.replaceChildren();
  d.append(el('button',{class:'close', onclick:closeJob, 'aria-label':'Close'}, 'Close ✕'));
  d.append(el('div',{class:'small'}, `${j.id} · Dispatchlark #${j.dl}`), el('h3',{}, j.customer + (j.company ? ' · '+j.company : '')), el('div',{class:'small'}, j.site),
    el('div',{style:'margin-top:8px;display:flex;gap:8px;flex-wrap:wrap'}, statusPill(j), el('span',{class:'pill'}, j.status), el('span',{class:'pill'}, j.system)));
  d.append(el('div',{class:'kv'},
    el('div',{}, el('span',{},'Price (before tax)'), el('b',{}, j.price ? money(j.price) : '—')),
    el('div',{}, el('span',{},'Gross profit'), el('b',{class: j.gp<0?'neg':''}, j.price ? money2(j.gp) : '—')),
    el('div',{}, el('span',{},'Margin'), el('b',{}, j.price ? pct(j.margin) : '—'))));
  d.append(el('div',{class:'small', style:'margin-top:6px'}, 'Price basis: '+j.priceSrc));
  const hd = D.hubspot.deals.find(x=>x.job===j.id);
  if (hd) d.append(el('div',{class:'small', style:'margin-top:4px'}, `HubSpot: ${hd.stage} · ${money(hd.amt)}`, hd.ok ? ' ✓ matches' : el('span',{class:'neg'}, ' ⚠ out of date. See the HubSpot deals tab')));

  if (j.flags.length){ d.append(el('h4',{},'What needs attention')); j.flags.forEach(f=>d.append(flagNode(f,false))); }

  if (j.lines.length){
    d.append(el('h4',{},'Cost breakdown'));
    if (j.price){
      const bar = el('div',{class:'segbar', style:'height:14px'});
      ['equip','crew','mat','extra','profit'].forEach(k => { const val=j.byCat[k]; if(!val) return; const s=el('div',{style:`flex:0 0 calc(${val/Math.max(j.price,j.cost)*100}% - 2px);background:${catColor(k)}`}); s.addEventListener('pointermove',ev=>showTip(ev,money2(val),D.cats.find(c=>c.key===k).label,pct(val/j.price)+' of price',catColor(k))); s.addEventListener('pointerleave',hideTip); bar.append(s);});
      d.append(bar, legend(['equip','crew','mat','extra','profit']));
    }
    const t = el('table',{}, el('thead',{}, el('tr',{}, el('th',{},'Cost line'), el('th',{},'Source'), el('th',{class:'num'},'Amount'))));
    const b = el('tbody');
    j.lines.forEach(l => b.append(el('tr',{}, el('td',{}, el('span',{class:'swatch', style:`background:${catColor(l.cat)}`}), l.label), el('td',{class:'small'}, l.src), el('td',{class:'num'}, money2(l.amt)))));
    t.append(b, el('tfoot',{}, el('tr',{}, el('td',{colspan:'2'},'Total direct cost'), el('td',{class:'num'}, money2(j.cost)))));
    d.append(t);
    if (j.unknowns) d.append(el('div',{class:'small neg', style:'margin-top:6px'}, '⚠ Not included yet: '+j.unknowns));
  }
  if (j.scenarios){
    d.append(el('h4',{},'What-if'));
    const t = el('table',{}, el('thead',{}, el('tr',{}, el('th',{},'Scenario'), el('th',{class:'num'},'Price'), el('th',{class:'num'},'Gross profit'), el('th',{class:'num'},'Margin'))));
    t.append(el('tbody',{}, j.scenarios.map(s => el('tr',{}, el('td',{}, s.label), el('td',{class:'num'}, money(s.rev)), el('td',{class:'num'}, money2(s.rev-s.cost)), el('td',{class:'num'}, pct((s.rev-s.cost)/s.rev))))));
    d.append(t);
  }
  d.append(el('h4',{},'Payments'));
  d.append(el('table',{}, el('tbody',{},
    el('tr',{}, el('td',{},'Received'), el('td',{class:'num'}, money2(j.received))),
    el('tr',{}, el('td',{class:'small', colspan:'2'}, j.receipts)),
    j.stage==='cancelled' ? el('tr',{}, el('td',{},'To refund'), el('td',{class:'num neg'}, money2(j.received))) :
    j.stage==='pipeline' ? null : el('tr',{}, el('td',{},'Still to collect'), el('td',{class:'num'}, money2(j.balance))))));
  if (j.fixes.length){ d.append(el('h4',{},'Record corrections')); d.append(el('ul',{class:'srcs'}, j.fixes.map(f=>el('li',{},f)))); }
  d.classList.add('open'); d.setAttribute('aria-hidden','false'); $('#scrim').classList.add('open');
  d.scrollTop = 0; $('.close', d).focus();
}
function closeJob(){ const d=$('#drawer'); d.classList.remove('open'); d.setAttribute('aria-hidden','true'); $('#scrim').classList.remove('open'); hideTip(); }

// ---------- theme ----------
const themes = ['auto','light','dark']; let ti = 0;
$('#themeBtn').addEventListener('click', () => { ti=(ti+1)%3; const t=themes[ti]; if(t==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); $('#themeBtn').textContent='Theme: '+t; });

function render(){
  const v = $('#view'); v.replaceChildren(); hideTip();
  const fn = {mylist:viewMyList, prices:viewPrices, crm:viewCRM, overview:viewOverview, jobs:viewJobs, money:viewMoney, orders:viewOrders, improve:viewImprove, fixes:viewFixes}[current] || viewOverview;
  v.append(fn());
}
$('#asof').textContent = 'Data as of ' + D.asOf + ' · USD before tax · Click anything to dig in';
renderTabs(); render();
})();
