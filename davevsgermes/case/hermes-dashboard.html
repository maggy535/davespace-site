d", "area": "CRM", "detail": "HubSpot shows $32,145 Closed Won, but the real figure is $27,795. Ben Foster's $4,800 deal is still Closed Won after he cancelled, and Marcus Reed's deal is $3,100 instead of $3,550. Julia Moreno sits at Appointment Scheduled with no appointment, and $3,000 is only her budget. The details are on the HubSpot check tab."}, {"pri": "This week", "title": "Purchasing rule adopted: no account purchases without an office PO", "impact": "Stops $1,284-type mistakes", "area": "Supplier", "detail": "Decided Nov 12. Only Daniel and Renee place Galloway-Hale orders. Every order carries the CCC job number as PO, and the crew picks up only orders the office has placed. Galloway-Hale changes user permissions by phone only, (813) 555-0142. Renee's buyer login is still an unaccepted invitation, so she can't order online yet. Messages to Galloway-Hale and Luis are drafted in 'Purchasing rule.txt'."}, {"pri": "This week", "title": "Put the Foster AURA kit on Marcus's job", "impact": "Saves $264 and 3 weeks", "area": "Supplier", "detail": "New AURAs are backordered until about Dec 9 and will bill at $1,269.88. Ben's kit is already paid for at $1,198 and sitting in van 2. Returning it would cost a 15% restocking fee ($192.56). Needs Luis's equipment sign-off."}, {"pri": "This week", "title": "Place the Dunedin and unit 11 orders by Friday", "impact": "Saves $194 vs Dec prices", "area": "Supplier", "detail": "Dunedin installs Monday and quote Q-260117 is cheaper than contract prices. Unit 11 needs Tampa's last 18k. Placing both before Dec 3 also avoids the 6% Senville increase."}, {"pri": "This week", "title": "Reply to Julia Moreno and book a morning survey", "impact": "~$3,000 lead", "area": "Sales", "detail": "Elena Brooks referred her. She has emailed twice (Nov 10, today) asking for a survey before 11 am, hasn't booked with anyone else, and has had no reply. Draft email 2 offers Fri Nov 13 or Wed Nov 18 at 9 am. Check both slots with Luis first."}, {"pri": "This week", "title": "Send Lena Ortiz the 2-year labor warranty answer", "impact": "$4,150 job", "area": "Sales", "detail": "Decided Nov 12: 2-year labor warranty on every installation. Draft email 3 answers her question and warns that the AURA is backordered until about Dec 9. If Marcus stays on the LETO, Ben's AURA kit can go to Lena instead, so she can be installed sooner."}, {"pri": "This week", "title": "Owen Clarke: keep $2,800 (decided). Fix the part, then send draft email 5", "impact": "Avoid a wrong order \u00b7 ~40% margin", "area": "Margin", "detail": "Decided Nov 12. Correct the part to the complete LETO 12k system (H41-112). Keep $2,800: Renee already confirmed it in writing for a complete system, he's price-shopping, and raising a sent quote risks the job. At $2,800 the margin is 40.6% if ordered before Dec 3 (39.1% after). Set Nov 30 as the confirm-by date. New quotes use the standard price list ($3,295). Draft email 5."}, {"pri": "Before quoting", "title": "Revise Priya Shah's quote", "impact": "\u2265 $351 not priced", "area": "Margin", "detail": "The $3,650 quote has no pump ($171.40 + $180 fitting), electrical feed or freight. Luis asked us not to give a final price from the base sheet. Hold the deposit until the landlord approves in writing, as Priya asked."}, {"pri": "Dec 10", "title": "Pay Galloway-Hale by Dec 10 for the 1% discount", "impact": "+$32", "area": "Owe", "detail": "$3,243.85 is open on terms of 1% 10th Prox, Net 25th. Paying by Dec 10 saves $32.44. Small, but it applies every month."}, {"pri": "Process", "title": "Put every callback and re-delivery on the job in Dispatchlark", "impact": "Real margins", "area": "Margin", "detail": "Dispatchlark shows completed jobs at 47.6%. With Noah's $150 callback the real figure is 46.2%. Clearwater shows 53.9% but is 49.4% with the $185 re-delivery. The job-costing report only sees what's entered."}, {"pri": "Process", "title": "Check the access window before dispatching deliveries", "impac  $('#app').innerHTML=`<div class="seg">${areas.map(a=>`<button class="${a==opf?'on':''}" onclick="opf='${a}';R.ops()">${a}</button>`).join('')}</div>
 <div class="card" style="padding:4px 14px">${D.ops.map((o,i)=>({...o,i})).filter(o=>opf=='All'||o.area==opf).map(o=>`<div class="op" onclick="if(event.target.type!='checkbox')this.classList.toggle('open')">

 $('#app').innerHTML=`<div class="grid k3">

 <div class="card" style="margin-top:14px;padding:6px 8px"><table><thead><tr><th>Deal</th><th>HubSpot stage</th><th class="n">HubSpot amount</th><th class="n">Real amount</th><th>What's wrong</th><th>Fix in HubSpot</th></tr></thead><tbody>
 ${rows.sort((a,b)=>({bad:0,warn:1,ok:2})[a.lvl]-({bad:0,warn:1,ok:2})[b.lvl]).map(r=>`<tr class="row" onclick="go('jobs','${r.id}')"><td style="white-space:nowrap"><b>${r.id}</b><div class="small mut">${r.site.split(' / ')[0]}</div></td>

 </tbody></table></div>
 <div class="card" style="margin-top:14px"><h3>CRM housekeeping</h3><ul class="notes small" style="padding-left:18px;margin:0">${c.hygiene.map(h=>`<li>${h}</li>`).join('')}</ul>
 <div class="small mut" style="margin-top:10px">From HubSpot exports taken Nov 12. I haven't changed anything in HubSpot; these are fixes for you to make. Click a row to open the job.</div></div>`;};
