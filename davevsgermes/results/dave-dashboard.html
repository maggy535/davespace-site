const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const usd = n => n==null?'':(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const usd0 = n => n==null?'':Number.isInteger(n)?'$'+n.toLocaleString('en-US'):usd(n);
const pct = n => n==null?'':n.toFixed(1)+'%';
const byId = Object.fromEntries(D.jobs.map(j=>[j.id,j]));
const GROUP = {margin:'Job margin',equipment:'Equipment',crew:'Crew',materials:'Materials and permit',extras:'Extras: electrician, callback, delivery, financing'};
const GROUP_SHORT = {margin:'Job margin',equipment:'Equipment',crew:'Crew',materials:'Materials and permit',extras:'Extras'};
const VIEWS = [['overview','Overview'],['jobs','Jobs'],['money','Who owes whom'],['orders','Supplier orders'],['improve','Do better'],['records','Record conflicts']];
const STAGE_PILL = {finished:['good','✓'],booked:['info','●'],open:['plain','…'],lead:['warn','!'],cancelled:['crit','✕']};
function pill(j){const [c,i]=STAGE_PILL[j.stage];return `<span class="pill ${c}"><span aria-hidden="true">${i}</span>${esc(j.stage_label)}</span>`}
function jobHash(view,id){return `#/${view}/${id}`}
function currentView(){const p=location.hash.replace(/^#\/?/,'').split('/');return VIEWS.some(v=>v[0]===p[0])?p[0]:'overview'}
function jobLink(id,label){const v=currentView();return `<a href="${jobHash(v,id)}">${esc(label||id)}</a>`}
function who(j){return j.company?`${j.customer}, ${j.company}`:j.customer}
function shortSite(j){return j.site.split(' / ')[0]}

function nav(){
  const v=currentView();
  const counts={jobs:D.jobs.length,orders:D.orders.filter(o=>o.state==='now').length,improve:D.improve.length,records:D.conflicts.length};
  $('#nav').innerHTML=VIEWS.map(([k,l])=>`<a href="#/${k}" ${k===v?'aria-current="page"':''}><span>${l}</span>${counts[k]?`<span class="count">${counts[k]}</span>`:''}</a>`).join('');
}

/* ---- Overview ---- */
function barRow(j){
  const base=j.price||0;
  const scale=Math.max(...D.jobs.map(x=>x.price||0));
  const parts=[['margin',j.margin],['equipment',j.cost_by_group.equipment],['crew',j.cost_by_group.crew],['materials',j.cost_by_group.materials],['extras',j.cost_by_group.extras]].filter(p=>p[1]>0);
  const segs=parts.map(([g,v])=>`<div class="seg ${g}" style="flex:0 0 calc(${(v/scale*100).toFixed(3)}% - 2px)" data-tip="<b>${esc(GROUP_SHORT[g])}</b>: <b>${usd(v)}</b> (${(v/base*100).toFixed(1)}% of ${usd0(base)})"></div>`).join('');
  const sum=parts.map(([g,v])=>`${GROUP_SHORT[g]} ${usd(v)}`).join(', ');
  const note=j.partial?'ceiling':j.whatif&&j.whatif.kind==='lena'?'before financing':pct(j.pct);
  return `<button class="jbar" type="button" data-job="${j.id}" aria-label="${esc(j.customer)}, ${esc(j.site)}. Price ${usd0(base)}. ${esc(sum)}. Margin ${pct(j.pct)}. Open details.">
    <span class="who"><b>${esc(j.customer)}</b><span>${esc(shortSite(j))}</span></span>
    <span class="track">${segs}</span>
    <span class="val"><b>${usd0(j.margin)}</b><span>${esc(note)}</span></span></button>`;
}

    <a class="tile" href="#/money"><span class="k">We owe now</span><span class="v">${usd0(m.we_owe_total)}</span><span class="d">Includes Ben's $1,200 and $1,050 to verify</span></a>
    <a class="tile" href="#/orders"><span class="k">Galloway-Hale orders placed</span><span class="v">${usd0(D.order_now)}</span><span class="d">2 jobs, in branch review. Prices rise in ${D.days_to_rise} days</span></a>

    </section>
    <section class="card pad" aria-labelledby="c2">

      <p class="foot" style="margin-top:12px"><a href="#/improve">See all ${D.improve.length} things to do better</a></p>

  ${srcBlock()}`;
}
function srcBlock(){

  const val=(j,k)=>k==='stage'?STAGE_ORDER[j.stage]*1000+(j.pct??0):k==='customer'?j.customer:(j[k]??-1e9);

  const P=sum('price'),M=sum('margin');
  return `<div class="page-head"><h1>Jobs</h1><p>What each job really makes, after the emails and invoices the working file missed. Click any job for its costs, sources and open items.</p></div>
  <div class="chips" role="group" aria-label="Filter jobs">${FILTERS.map(([k,l])=>`<button class="chip" type="button" data-filter="${k}" aria-pressed="${k===jobFilter}">${l}</button>`).join('')}</div>
  <section class="card"><div class="table-wrap"><table><thead><tr>
    ${cols.map(([k,l,n])=>`<th class="${n?'num':''}" ${jobSort.k===k?`aria-sort="${jobSort.dir>0?'ascending':'descending'}"`:''}><button type="button" data-sort="${k}">${l}${jobSort.k===k?(jobSort.dir>0?' ↑':' ↓'):''}</button></th>`).join('')}
  </tr></thead><tbody>
  ${js.map(j=>`<tr class="click" data-job="${j.id}"><td><a href="${jobHash('jobs',j.id)}"><b>${esc(j.customer)}</b></a><span class="m">${esc(j.id)} · ${esc(j.site)}</span></td>
    <td>${pill(j)}</td>
    <td class="num">${j.stage==='cancelled'?'<span class="m">was '+usd0(j.quoted)+'</span>':j.price==null?'<span class="m">no quote</span>':usd(j.price)}</td>
    <td class="num">${j.costs.length?usd(j.cost):'-'}</td>
    <td class="num">${j.margin==null?'-':usd(j.margin)}${j.partial?'<span class="m">ceiling</span>':''}${j.whatif&&j.whatif.kind==='lena'?'<span class="m">before financing</span>':''}</td>
    <td class="num">${j.pct==null?'-':pct(j.pct)}</td>
    <td class="num">${j.received?usd(j.received):'-'}</td>
    <td class="num">${j.balance?usd(j.balance):'-'}</td></tr>`).join('')}
  </tbody>${sold?`<tfoot><tr><td colspan="2">Finished and booked in this view</td><td class="num">${usd(P)}</td><td class="num">${usd(sum('cost'))}</td><td class="num">${usd(M)}</td><td class="num">${P?pct(M/P*100):''}</td><td class="num">${usd(sum('received'))}</td><td class="num">${usd(sum('balance'))}</td></tr></tfoot>`:''}</table></div></section>
  <p class="foot">Three more Homeleaf-financed jobs were funded in October (Kim, Patel, Hughes), but they appear in no job record here, so they can't be costed.</p>`;
}

/* ---- Money ---- */
function viewMoney(){
  const m=D.money;
  const owed=m.owed_to_us.map(o=>`<div class="li"><div><b>${esc(o.who)}</b><br><span class="sub">${esc(o.what)}</span></div><div class="amt">${usd(o.amount)}${o.net!==o.amount?`<div class="sub" style="font-weight:400">you receive ${usd(o.net)}</div>`:''}</div><p>Expected ${esc(o.when_label)}. ${esc(o.basis)}. ${jobLink(o.job,'Open job')}</p></div>`).join('');
  const certPill=c=>({firm:'good',decision:'crit',check:'warn'}[c]||'plain');
  const owe=m.we_owe.map(o=>`<div class="li"><div><b>${esc(o.who)}</b><br><span class="sub">${esc(o.what)}</span></div><div class="amt">${usd(o.amount)}</div><p><span class="pill ${certPill(o.certainty)}">${esc(o.certainty_label)}</span> ${esc(o.when)}. ${esc(o.detail)} ${o.job?jobLink(o.job,'Open job'):''}</p></div>`).join('');
  const later=m.not_yet_owed.map(o=>`<div class="li"><div><b>${esc(o.who)}</b><br><span class="sub">${esc(o.what)}</span></div><div class="amt">${usd(o.amount)}</div><p>${esc(o.detail)} ${o.job?jobLink(o.job,'Open job'):''}</p></div>`).join('');
  return `<div class="page-head"><h1>Who owes whom</h1><p>Deposits are kept apart from sales. A deposit isn't money you've earned until the job is done.</p></div>
  <div class="two">
  <div class="stack">
    <section class="card pad" aria-labelledby="m1"><h2 id="m1">Customers owe us</h2><div class="big">${usd(m.owed_total)}</div>
      <p class="sub">Nothing is overdue. None of this is invoiced yet, which is why Dispatchlark shows $0.00 unpaid. It becomes due as installs finish.</p>
      <div class="ledger">${owed}</div></section>
    <section class="card pad" aria-labelledby="m3"><h2 id="m3">Money in so far</h2>
      <div class="recon"><div><b>${usd0(m.total_receipts)}</b><span>Received, 9 receipts</span></div><div><b>${usd0(m.sales_done)}</b><span>Earned on 3 finished jobs</span></div><div><b>${usd0(m.deposits_held)}</b><span>Deposits on unfinished work</span></div></div>
      <div class="table-wrap"><table style="margin-top:12px"><thead><tr><th>Deposit held from</th><th>Job</th><th class="num">Amount</th></tr></thead><tbody>
      ${m.deposits.map(d=>`<tr><td>${esc(d.who)}</td><td>${jobLink(d.job,d.note)}</td><td class="num">${usd(d.amount)}</td></tr>`).join('')}</tbody></table></div>
      <p class="foot">Ava's bank confirmation repeats receipt RCPT-1095. It's counted once.</p></section>
  </div>
  <div class="stack">
    <section class="card pad" aria-labelledby="m2"><h2 id="m2">We owe</h2><div class="big">${usd(m.we_owe_total)}</div>
      <p class="sub">Billed or requested now. Payment terms for Palmetto aren't in any record.</p>
      <div class="ledger">${owe}</div></section>
    <section class="card pad" aria-labelledby="m4"><h2 id="m4">Coming, or to check, not counted above</h2>
      <div class="ledger">${later}</div></section>
    <section class="card pad" aria-labelledby="m5"><h2 id="m5">Galloway-Hale open invoices</h2>
      <div class="table-wrap"><table style="margin-top:8px"><thead><tr><th>Invoice</th><th>Job</th><th>Date</th><th class="num">Amount</th></tr></thead><tbody>
      ${m.gh_open.map(i=>`<tr><td>${esc(i.inv)}</td><td>${jobLink(i.job,i.name)}</td><td>${esc(i.date)}</td><td class="num">${usd(i.amount)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="3">Net due Dec 25. Pay by Dec 10 to save ${usd(m.gh_discount)}</td><td class="num">${usd(m.gh_total)}</td></tr></tfoot></table></div></section>
  </div></div>`;
}

/* ---- Orders ---- */
function stockText(l){
  const total=Object.values(l.stock).reduce((a,b)=>a+b,0);
  if(!total)return '<span class="neg">None at any branch</span>';
  const t=l.stock.Tampa;
  const others=Object.entries(l.stock).filter(([k,v])=>k!=='Tampa'&&v>0).map(([k,v])=>`${k} ${v}`).join(', ');
  return `${t} at Tampa${others?`<span class="m">${esc(others)}</span>`:''}`;
}
function orderText(o){return `${o.title} (${o.job}), PO ${o.job}\n`+o.lines.map(l=>`${l.qty} x ${l.item} ${l.part} at ${usd(l.price)} = ${usd(l.ext)}`).join('\n')+`\nTotal ${usd(o.total)}`}
function orderCard(o){
  const statePill={placed:'good',now:'good',gated:'warn',done:'plain'}[o.state];
  const icon={placed:'✓',now:'✓',gated:'…',done:'•'}[o.state];
  return `<article class="card order">
   <div class="order-top"><h3>${jobLink(o.job,o.title)}</h3><span class="pill ${statePill}"><span aria-hidden="true">${icon}</span>${esc(o.state_label)}</span></div>
   <div class="meta"><span>Needed: <b>${esc(o.need_by)}</b></span><span>Order by: <b>${esc(o.order_by)}</b></span>${o.total?`<span>Cost: <b>${usd(o.total)}</b>${o.after_rise>o.total?` (${usd(o.after_rise)} from Nov 27)`:''}</span>`:''}</div>
   <p class="how">${esc(o.how)}</p><p class="why">${esc(o.why)}</p>
   ${o.blockers.length?`<ul class="gate" aria-label="Still needed">${o.blockers.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`:''}
   ${o.lines.length?`<div class="table-wrap"><table><thead><tr><th>Item</th><th>Description</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Total</th><th>Stock</th></tr></thead><tbody>
    ${o.lines.map(l=>`<tr><td>${esc(l.item)}<span class="m">${esc(l.part)}</span></td><td>${esc(l.name)}</td><td class="num">${l.qty}</td><td class="num">${usd(l.price)}</td><td class="num">${usd(l.ext)}</td><td>${stockText(l)}</td></tr>`).join('')}
   </tbody></table></div>`:''}
   ${o.state==='now'?`<p style="margin-top:10px"><button class="btn" type="button" data-copy="${esc(o.job)}">Copy order list</button></p>`:''}
  </article>`;
}
function viewOrders(){
  const sec=(t,s,sub)=>`<h2 style="font-size:15px;margin:18px 0 8px">${t} <span class="sub" style="font-weight:400">${sub}</span></h2><div class="stack">${D.orders.filter(o=>o.state===s).map(orderCard).join('')}</div>`;
  return `<div class="page-head"><h1>Supplier orders</h1><p>Every open job, checked against Galloway-Hale prices, quotes and branch stock. Two orders were placed on Nov 7 and await branch review. Nothing else is ordered without your word.</p></div>
  <div class="tiles">
   <div class="tile" style="display:flex;flex-direction:column;gap:3px;padding:15px 16px;background:var(--surface);border-radius:12px;box-shadow:0 0 0 1px var(--ring)"><span class="k">Placed Nov 7</span><span class="v">${usd(D.order_now)}</span><span class="d">W6229998 Dunedin, W6290699 St. Petersburg</span></div>
   <div class="tile" style="display:flex;flex-direction:column;gap:3px;padding:15px 16px;background:var(--surface);border-radius:12px;box-shadow:0 0 0 1px var(--ring)"><span class="k">Senville price rise, 6%</span><span class="v">${D.days_to_rise} days</span><span class="d">Invoiced from Nov 27. Brackets and covers don't change</span></div>
   <div class="tile" style="display:flex;flex-direction:column;gap:3px;padding:15px 16px;background:var(--surface);border-radius:12px;box-shadow:0 0 0 1px var(--ring)"><span class="k">Credit available</span><span class="v">${usd0(D.available_credit)}</span><span class="d">Of $15,000. Enough for everything below</span></div>
  </div>
  ${sec('Placed','placed','Awaiting branch review')}
  ${sec('Waiting on something','gated','Order as soon as each item clears')}
  ${sec('Nothing to order','done','')}
  <p class="foot">Nov 26 is Thanksgiving. I didn't find Galloway-Hale's holiday hours, so Nov 25 is the safer last day. Stock was read on Nov 7 and will move.</p>`;
}

/* ---- Improve ---- */
function viewImprove(){
  const confPill={Confirmed:'good',Likely:'info',Speculative:'plain'};
  return `<div class="page-head"><h1>What you could do better</h1><p>Ranked by what matters first, not only by dollars. Each one shows how sure I am and where it came from.</p></div>
  <div class="stack">${D.improve.map(i=>`<article class="card imp"><div class="n">${i.rank}</div>
    <div><h3>${esc(i.title)}</h3><p>${esc(i.what)}</p><p><b>What to do:</b> ${esc(i.do)}</p>
    <div class="foot">${i.decided?`<span class="pill good"><span aria-hidden="true">✓</span>${esc(i.decided)}</span>`:''}<span class="pill ${confPill[i.conf]}">${esc(i.conf)}</span><span>${esc(i.basis)}</span>${i.job?jobLink(i.job,'Open job'):''}</div></div>
    <div class="aside">${i.value!=null?`<b>${usd(i.value)}</b>`:''}<span>${esc(i.value_label)}</span></div></article>`).join('')}</div>`;
}

/* ---- Records ---- */
function viewRecords(){
  return `<div class="page-head"><h1>Where the records disagree</h1><p>This is why no single record could be trusted alone. The Fix column shows what was corrected on Nov 7 and what's still open. "Used here" is the figure behind this dashboard. Changes made at your request: record corrections in Dispatchlark and HubSpot, seven draft emails saved and two Galloway-Hale orders placed.</p></div>
  <section class="card"><div class="table-wrap"><table style="min-width:980px"><thead><tr><th>Item</th><th>Working file</th><th>Dispatchlark</th><th>Other source</th><th>Used here</th><th>Fix</th></tr></thead><tbody>
  ${D.conflicts.map(c=>`<tr><td>${c.job?jobLink(c.job,c.topic):esc(c.topic)}</td><td>${esc(c.file)}</td><td>${esc(c.dispatch)}</td><td>${esc(c.other)}</td><td><b style="font-weight:600">${esc(c.used)}</b></td><td>${esc(c.fix)}</td></tr>`).join('')}
  </tbody></table></div></section>`;
}

/* ---- Job panel ---- */
function panelCalc(j,x){
  const base={price:j.price,cost:j.cost};
  if(!j.whatif)return base;
  const w=j.whatif.kind;
  if(w==='marcus'){const fee=(2000+x)*D.fees['1201'],old=2000*D.fees['1201'];return{price:j.price+x,cost:j.cost-old+fee,fee}}
  if(w==='lena'){const fee=x*D.fees['2401'];return{price:j.price,cost:j.cost+fee,fee}}
  if(w==='priya'){return{price:j.price,cost:j.cost+x}}
  return base;
}
function renderFigs(j,x){
  const c=panelCalc(j,x);const margin=c.price-c.cost;const p=margin/c.price*100;
  const lab=j.partial?(x?'Job margin so far':'Job margin ceiling'):'Job margin';
  return `<div><span>Price before tax</span><b>${usd(c.price)}</b></div><div><span>Direct cost</span><b>${usd(c.cost)}</b>${c.fee!=null?`<em>Homeleaf fee ${usd(c.fee)}</em>`:''}</div><div><span>${lab}</span><b>${usd(margin)}</b><em>${pct(p)}</em></div>`;
}
function panelHTML(j){
  const orders=D.orders.filter(o=>o.job===j.id);
  const conflicts=D.conflicts.filter(c=>c.job===j.id);
  const actions=D.actions.filter(a=>a.job===j.id);
  const hasMoney=j.costs.length&&j.price;
  const parts=hasMoney?[['margin',j.margin],['equipment',j.cost_by_group.equipment],['crew',j.cost_by_group.crew],['materials',j.cost_by_group.materials],['extras',j.cost_by_group.extras]].filter(p=>p[1]>0):[];
  const alts=[];
  if(j.dl_margin!=null&&j.dl_margin!==j.margin)alts.push(['Dispatchlark job costing shows',`${usd(j.dl_margin)} (${pct(j.dl_pct)})`]);
  if(j.baseline)alts.push([j.baseline.label,usd(j.baseline.margin)]);
  if(j.wrong)alts.push([j.wrong.label,usd(j.wrong.margin)]);
  if(j.stage==='cancelled')alts.push(['Quote before cancelling',usd(j.quoted)]);
  return `<div class="p-head"><div class="top"><span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="sub">${esc(j.id)} · Dispatchlark #${j.dl}</span>${pill(j)}</span>
    <button class="close" type="button" id="p-close" aria-label="Close job details">×</button></div>
    <h2 id="p-title">${esc(who(j))}</h2><p class="sub">${esc(j.site)} · ${esc(j.system)}</p></div>
  <div class="p-body">
    <p>${esc(j.summary)}</p>
    ${hasMoney?`<div class="figs" id="figs">${renderFigs(j,j.whatif?j.whatif.value:0)}</div>`:''}
    ${j.whatif?`<div class="whatif"><label for="wi"><span>${esc(j.whatif.label)}</span><span id="wi-v" style="font-variant-numeric:tabular-nums">${usd0(j.whatif.value)}</span></label>
      <input id="wi" type="range" min="0" max="${j.whatif.max}" step="${j.whatif.step}" value="${j.whatif.value}"><p>${esc(j.whatif.hint)} Try it: this changes only what you see here.</p></div>`:''}
    ${actions.length?`<div><h3>Needs you</h3><ul class="alt">${actions.map(a=>`<li><span><span class="dot ${a.tone}" aria-hidden="true"></span>${esc(a.title)}<br><span class="sub">${esc(a.detail)}</span></span><b>${esc(a.when)}</b></li>`).join('')}</ul></div>`:''}
    ${hasMoney?`<div><h3>Where the ${usd0(j.price)} goes</h3><div class="mini" aria-hidden="true">${parts.map(([g,v])=>`<div class="seg ${g}" style="flex:${v} 1 0" data-tip="<b>${esc(GROUP_SHORT[g])}</b>: <b>${usd(v)}</b>"></div>`).join('')}</div>
      <table class="cost"><tbody>${j.costs.map(l=>`<tr><td>${esc(l.label)}<span class="m">${esc(l.source)}</span></td><td class="num">${usd(l.amount)}</td></tr>`).join('')}</tbody><tfoot><tr><td>Direct cost</td><td class="num">${usd(j.cost)}</td></tr></tfoot></table></div>`:''}
    ${alts.length?`<div><h3>Other figures you may have seen</h3><ul class="alt">${alts.map(a=>`<li><span>${esc(a[0])}</span><b>${a[1]}</b></li>`).join('')}</ul></div>`:''}
    <div><h3>Money</h3>${j.receipts.length?`<table class="cost"><tbody>${j.receipts.map(r=>`<tr><td>${esc(r.purpose)}, ${esc(r.date)}<span class="m">${esc(r.id)} · ${esc(r.ref)}</span></td><td class="num">${usd(r.amount)}</td></tr>`).join('')}</tbody></table>`:'<p class="empty">Nothing received.</p>'}
      ${j.balance?`<p style="margin-top:6px"><b style="font-weight:600">${usd(j.balance)} still to bill.</b> <span class="sub">${esc(j.balance_terms)}</span></p>`:''}</div>
    ${orders.length?`<div><h3>Supplier order</h3><ul class="alt">${orders.map(o=>`<li><span>${esc(o.how)}</span><b><a href="#/orders">${esc(o.state_label)}</a></b></li>`).join('')}</ul></div>`:''}
    ${conflicts.length?`<div><h3>Where the records disagree</h3><ul class="alt">${conflicts.map(c=>`<li><span>${esc(c.topic)}<br><span class="sub">To fix: ${esc(c.fix)}</span></span><b style="font-weight:500;text-align:right;white-space:normal;max-width:45%">${esc(c.used)}</b></li>`).join('')}</ul></div>`:''}
    ${j.hubspot?`<div><h3>HubSpot</h3><p class="sub">${esc(j.hubspot.text)}</p></div>`:''}
    <div><h3>Read from</h3><div class="tags">${j.sources.map(s=>`<span>${esc(s)}</span>`).join('')}</div></div>
  </div>`;
}
let lastFocus=null,panelFor=null;
function openPanel(id){
  const j=byId[id];const panel=$('#panel');if(!j)return;
  if(panelFor!==id){lastFocus=document.activeElement;}
  panel.innerHTML=panelHTML(j);panel.scrollTop=0;
  panel.classList.add('on');$('#scrim').classList.add('on');panelFor=id;
  $('#p-close').onclick=closePanel;$('#p-close').focus({preventScroll:true});
  const wi=$('#wi');
  if(wi){wi.oninput=()=>{const x=+wi.value;$('#wi-v').textContent=usd0(x);$('#figs').innerHTML=renderFigs(j,x)}}
}
function closePanel(){location.hash='#/'+currentView()}
function hidePanel(){const panel=$('#panel');panel.classList.remove('on');$('#scrim').classList.remove('on');panelFor=null;if(lastFocus&&document.contains(lastFocus))lastFocus.focus({preventScroll:true});lastFocus=null}

/* ---- Router ---- */
let lastView=null;
function render(){
  const v=currentView();const parts=location.hash.replace(/^#\/?/,'').split('/');const job=parts[1];
  nav();
  if(v!==lastView||!job){
    const html={overview:viewOverview,jobs:viewJobs,money:viewMoney,orders:viewOrders,improve:viewImprove,records:viewRecords}[v]();
    $('#main').innerHTML=html;
    if(v!==lastView&&!job){window.scrollTo(0,0);}
    lastView=v;
  }
  if(job&&byId[job])openPanel(job);else if(panelFor)hidePanel();
}
window.addEventListener('hashchange',render);
document.addEventListener('click',e=>{
  const row=e.target.closest('[data-job]');
  if(row&&!e.target.closest('a')){location.hash=jobHash(currentView(),row.dataset.job);return}
  const f=e.target.closest('[data-filter]');if(f){jobFilter=f.dataset.filter;$('#main').innerHTML=viewJobs();$(`[data-filter="${jobFilter}"]`).focus();return}
  const s=e.target.closest('[data-sort]');if(s){const k=s.dataset.sort;if(jobSort.k===k)jobSort.dir*=-1;else{jobSort.k=k;jobSort.dir=(k==='customer'||k==='stage')?1:-1}$('#main').innerHTML=viewJobs();$(`[data-sort="${k}"]`).focus();return}
  const c=e.target.closest('[data-copy]');
  if(c){const o=D.orders.find(x=>x.job===c.dataset.copy);const t=orderText(o);const done=()=>{const old=c.textContent;c.textContent='Copied';setTimeout(()=>c.textContent=old,1400)};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done).catch(()=>{window.prompt('Copy this order list',t)});else window.prompt('Copy this order list',t);return}
  if(e.target.id==='scrim')closePanel();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&panelFor){closePanel();return}
  if(e.key==='Tab'&&panelFor){const f=[...$('#panel').querySelectorAll('a[href],button,input')].filter(x=>x.offsetParent!==null);if(!f.length)return;const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){z.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===z){a.focus();e.preventDefault()}}
});
const tip=$('#tip');
document.addEventListener('pointermove',e=>{
  const s=e.target.closest&&e.target.closest('[data-tip]');
  if(!s){tip.style.display='none';return}
  tip.innerHTML=s.dataset.tip;tip.style.display='block';
  const w=tip.offsetWidth;const x=Math.min(e.clientX+14,innerWidth-w-8);tip.style.left=x+'px';tip.style.top=(e.clientY+16)+'px';
});
/* theme */
const themeBtn=$('#theme');
function curDark(){const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme:dark)').matches}
function setBtn(){themeBtn.textContent=curDark()?'Light theme':'Dark theme'}
try{const t=localStorage.getItem('ccc-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
setBtn();
themeBtn.onclick=()=>{const n=curDark()?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('ccc-theme',n)}catch(e){}setBtn()};
$('#asof').textContent='As of '+D.as_of;
render();
</script>
</body>
</html>
