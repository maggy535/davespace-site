   <div class="card"><h3>Coming up</h3><table>${[['Tue Nov 10','CCC-26095','Dunedin duplex · 2 systems'],['Wed Nov 11','CCC-26092','Marcus Reed · AURA'],['Thu Nov 12','CCC-26096','Clearwater coach house'],['Fri Nov 13','CCC-26098','Ben Foster · <span class="neg">CANCEL</span>'],['Mon Nov 16','CCC-26101','St. Pete unit 11'],['Tue Nov 17','CCC-26093','Priya Shah · tentative']].map(r=>`<tr class="row" onclick="openJ('${r[1]}')"><td class="mut">${r[0]}</td><td>${r[2]}</td><td class="r">${J[r[1]].flags.length?`<span class="flag">${J[r[1]].flags.length} issue${J[r[1]].flags.length>1?'s':''}</span>`:''}</td></tr>`).join('')}</table></div>
   <div class="card kpi click" onclick="go('jobs');setF('All')"><h3>HubSpot vs reality</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><div class="src">HubSpot Closed Won</div><div class="v amb" style="font-size:22px">${f0(D.hubspot.won)}</div></div><div><div class="src">Actually won (net of cancellation)</div><div class="v" style="font-size:22px">${f0(D.hubspot.realWon)}</div></div></div><div class="s">${D.jobs.filter(j=>j.hs.issue).length} deals out of date: Ben still Closed Won, Marcus at old price, Priya and Julia at the wrong stage</div></div>
   <div class="card"><h3>Customer deposits held</h3><div class="kpi"><div class="v">${f0(sum(D.deposits))}</div><div class="s">Held separately, not sales until the job is done (incl. Ben's $1,200 to refund)</div></div></div>
  </div></div>`}
function kpi(t,v,s,on){return `<div class="card kpi ${on?'click':''}" ${on?`onclick="${on}"`:''}><h3>${t}</h3><div class="v">${v}</div><div class="s">${s}</div></div>`}
function setF(f){jf=f;render()}

function jobs(){
 const st=['All','Completed','Booked','Pipeline','Lead','Cancelled'];
 const L=D.jobs.filter(j=>jf=='All'||j.stage==jf);
 return `<div class="chips">${st.map(s=>`<button class="chip ${s==jf?'on':''}" onclick="setF('${s}')">${s}</button>`).join('')}</div>
 <div class="card"><table><tr><th>Job</th><th>Customer / site</th><th>Stage</th><th class="r">Price</th><th class="r">Direct cost</th><th class="r">Gross profit</th><th>Margin</th><th class="r">Dispatchlark says</th><th>HubSpot says</th><th>Issues</th></tr>
 ${L.map(j=>`<tr class="row" onclick="openJ('${j.id}')"><td style="white-space:nowrap"><b>${j.id}</b><div class="src">#${j.dl}</div></td><td>${j.customer}<div class="src">${j.site}</div></td><td><span class="pill p-${j.stage}">${j.stage}</span></td>
  <td class="r">${j.revenue?fm(j.revenue):'-'}</td><td class="r">${j.cost?fm(j.cost):'-'}</td><td class="r"><b class="${j.profit<0?'neg':''}">${j.revenue?fm(j.profit):'-'}</b></td>
  <td>${j.margin!=null?`<div style="display:flex;gap:8px;align-items:center"><div class="bar" style="flex:1"><i style="width:${j.margin*1.6}%;background:${mcol(j.margin)}"></i></div><span>${j.margin}%</span></div>`:'<span class="mut">-</span>'}</td>
  <td class="r mut">${j.dlMargin?j.dlMargin+'%':j.revenue?'incomplete':'-'}</td><td class="${j.hs.issue?'amb':'mut'}" style="white-space:nowrap">${j.hs.stage}<div class="src">${f0(j.hs.amount)}${j.hs.issue?' ⚠':''}</div></td><td>${j.flags.map(f=>`<span class="flag">${f.split(':')[0]}</span>`).join('')}</td></tr>`).join('')}
 </table><div class="note">Click a row for the full cost breakdown and where every number comes from. "Dispatchlark says" is its own job-costing, which is missing costs that were only agreed by email.</div></div>`}

function openJ(id){const j=J[id];
 const mx=Math.max(j.revenue,j.cost,1);
 $('#drawer').innerHTML=`<button class="x" onclick="closeD()">Close</button><div class="src">${j.id} · Dispatchlark #${j.dl}</div><h2 style="margin:4px 0 2px">${j.customer}</h2><div class="mut">${j.site}</div>
 <div style="margin:10px 0"><span class="pill p-${j.stage}">${j.stage}</span> <span class="mut" style="margin-left:6px">${j.status}</span></div>
 <div class="grid k3" style="margin:14px 0">${kpi('Price',j.revenue?fm(j.revenue):'-','')}${kpi('Direct cost',j.cost?fm(j.cost):'-','')}${kpi('Gross profit',j.revenue?fm(j.profit):'-',j.margin!=null?j.margin+'% margin':'')}</div>
 <div class="src">${j.revNote}</div>
 <div class="src" style="margin-top:6px">HubSpot deal: <b class="${j.hs.issue?'amb':''}">${j.hs.stage} · ${f0(j.hs.amount)}</b>${j.hs.issue?' · '+j.hs.issue:''}</div>
 ${j.flags.length?`<div style="margin-top:12px">${j.flags.map(f=>`<div class="flag" style="display:block;margin:4px 0;padding:5px 9px">⚠ ${f}</div>`).join('')}</div>`:''}
 ${j.lines.length?`<h3 style="margin-top:18px;font-size:13px;color:var(--mut)">COST BREAKDOWN</h3><div class="wf">${j.lines.map(l=>`<div><div>${l.label}${l.kind!='cost'?`<span class="tag t-${l.kind}">${l.kind=='hidden'?'NOT IN DISPATCHLARK':'UNKNOWN'}</span>`:''}<div class="src">${l.src}${l.note?' · '+l.note:''}</div></div><div class="r">${l.kind=='unknown'?'<span class="neg">?</span>':fm(l.amount)}</div></div>`).join('')}
  <div style="border-top:1px solid var(--line);padding-top:6px"><b>Total direct cost</b><b class="r">${fm(j.cost)}</b></div></div>`:'<p class="mut">No costs: '+(j.stage=='Cancelled'?'job cancelled.':'no survey or equipment yet.')+'</p>'}
 ${j.scenario?`<div class="card" style="margin-top:10px"><h3>What-if</h3>${j.scenario.label}: profit <b class="pos">${fm(j.scenario.profit)}</b> (${j.scenario.margin}%)</div>`:''}
 <div class="next"><b>Next step:</b> ${j.next}</div>`;
 $('#drawer').classList.add('open');$('#scrim').classList.add('open')}
function closeD(){$('#drawer').classList.remove('open');$('#scrim').classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeD()});

function tbl(rows,cols){return `<table><tr>${cols.map(c=>`<th class="${c[2]||''}">${c[0]}</th>`).join('')}</tr>${rows.map(r=>`<tr class="${r.job&&J[r.job]?'row':''}" ${r.job&&J[r.job]?`onclick="openJ('${r.job}')"`:''}>${cols.map(c=>`<td class="${c[2]||''}">${c[1](r)}</td>`).join('')}</tr>`).join('')}</table>`}
function cash(){
 const owed=sum(D.owedToUs), now=sum(D.weOweNow), soon=sum(D.weOweSoon), H=D.homeleaf;
 const tot=owed+now+soon;
 return `<div class="grid k3">${kpi('Customers will owe us',fm(owed),'All after work is done. Nothing overdue today')}${kpi('We owe now',fm(now),'Galloway-Hale open invoices + Ben Foster refund')}${kpi('We will owe soon',fm(soon),'Crew, electrician, delivery and Monday orders')}</div>
 <div class="card" style="margin-top:14px"><h3>Cash in vs out, next ~6 weeks</h3><div class="stack"><div style="flex:${owed};background:var(--grn)">In ${f0(owed)}</div><div style="flex:${now};background:var(--red)">Now ${f0(now)}</div><div style="flex:${soon};background:var(--amb)">Soon ${f0(soon)}</div></div>
 <div class="legend"><span><b style="background:var(--grn)"></b>Coming in</span><span><b style="background:var(--red)"></b>Owed now</span><span><b style="background:var(--amb)"></b>Owed as jobs finish</span><span>Net: <b class="${owed-now-soon>=0?'pos':'neg'}">${fm(owed-now-soon)}</b> (before overhead)</span></div>
 <div class="note">The net is negative because ${f0(sum(D.deposits)-1200)} of customer deposits for these jobs already came in during October and early November. That money is in the bank but is earmarked for these costs, so don't treat it as spare cash.</div></div>
 <div class="grid k2" style="margin-top:14px">
  <div class="card"><h3>Who owes us</h3>${tbl(D.owedToUs,[['Customer',r=>r.who],['Job',r=>jl(r.job)],['Amount',r=>fm(r.amount),'r'],['When',r=>`${r.when}<div class="src">${r.status}</div>`]])}
   <h3 style="margin-top:18px">Deposits we're holding</h3>${tbl(D.deposits,[['Customer',r=>r.who],['Job',r=>jl(r.job)],['Amount',r=>fm(r.amount),'r']])}</div>
  <div class="card"><h3>Who we owe: now</h3>${tbl(D.weOweNow,[['Payee',r=>r.who],['Job',r=>jl(r.job)],['Amount',r=>fm(r.amount),'r'],['Due',r=>r.when]])}
   <h3 style="margin-top:18px">Who we owe: as jobs finish</h3>${tbl(D.weOweSoon,[['Payee',r=>r.who],['Job',r=>jl(r.job)],['Amount',r=>fm(r.amount),'r'],['When',r=>r.when]])}
   <h3 style="margin-top:18px">Check: crew bills for finished jobs</h3><div class="src" style="margin-bottom:6px">No system records whether Palmetto has been paid for these. Confirm with Paula.</div>
   ${tbl(D.unconfirmed,[['Payee',r=>r.who],['Job',r=>jl(r.job)],['Amount',r=>fm(r.amount),'r']])}</div></div>
 <div class="card" style="margin-top:14px"><h3>Homeleaf financing</h3><div class="grid k3">
  <div>${tbl(H.open,[['Request',r=>r.pr],['Customer',r=>r.who],['Now',r=>fm(r.amount),'r'],['Should be',r=>`<b class="amb">${fm(r.should)}</b>`,'r']])}<div class="src" style="margin-top:6px">Homeleaf says the amount must match the job's final price. Marcus upgraded to $3,550.</div></div>
  <div>${tbl(H.approved,[['Approved, no request',r=>r.who],['Line',r=>fm(r.line),'r'],['Plan',r=>r.plan]])}</div>
  <div>${tbl(H.plans,[['Plan',r=>r[0]],['Terms',r=>r[1]],['Your fee',r=>`<b class="${r[2]>10?'neg':r[2]>5?'amb':'pos'}">${r[2]}%</b>`,'r']])}<div class="src" style="margin-top:6px">October: ${fm(H.october.fees)} fees on ${fm(H.october.gross)} financed (${(100*H.october.fees/H.october.gross).toFixed(1)}%).</div></div>
 </div></div>`}

function orders(){
 const g={};D.orders.forEach(o=>(g[o.action]=g[o.action]||[]).push(o));
 const order=['Order now','Order after sign-off','Hold','If accepted',"Don't buy"], col={'Order now':'pos','Order after sign-off':'amb','Hold':'mut','If accepted':'mut',"Don't buy":'neg'};
 return `<div class="grid k4">${kpi('Place Monday Nov 9',fm(D.orderNow),'3 jobs · Tampa-Main will call')}${kpi('Senville +6% on',"Nov 27",'Systems & indoor units only')}${kpi('Brandon branch','Closed Nov 12','No transfers from Brandon that day')}${kpi('Equipment already in van 2',f0(sum(D.vanStock,'value')),"Ben Foster's cancelled kit")}</div>
 <div class="card" style="margin-top:14px"><h3>Reuse what's already bought</h3>${tbl(D.vanStock,[['Item',r=>r.item],['From',r=>r.from],['Use for',r=>r.to],['Value',r=>fm(r.value),'r']])}
  <div class="src" style="margin-top:6px">Luis needs to sign off on the AURA for Marcus. If returned instead: 15% restocking fee ($192.56) and a replacement AURA is backordered until about Dec 3.</div></div>
 ${order.filter(a=>g[a]).map(a=>`<div class="card" style="margin-top:14px"><h3 class="${col[a]}">${a} ${a.startsWith('Order')?'· '+fm(sum(g[a],'ext')):''}</h3>
  ${tbl(g[a],[['Job',r=>jl(r.job)],['Item',r=>`<b>${r.item}</b> ${r.desc}<div class="src">${r.mfr}</div>`],['Qty',r=>r.qty,'r'],['Unit',r=>fm(r.unit)+(r.next?`<div class="src">${fm(r.next)} from Nov 27</div>`:''),'r'],['Total',r=>fm(r.ext),'r'],['Stock',r=>`<span class="src">${r.stock}</span>`],['Need by',r=>r.needBy],['Order by',r=>r.orderBy],['Why',r=>`<span class="src">${r.why}</span>`]])}</div>`).join('')}
 <div class="note">Prices: your Galloway-Hale contract price book and quote Q-260117, as of Nov 7. Nothing has been ordered. The office placed no orders.</div>`}

function fix(){
 return `<div class="card"><h3>What we could be doing better, ranked</h3>${D.fixes.map((f,i)=>`<div class="fix" onclick="this.classList.toggle('open')"><div class="n P${f.p}">P${f.p}</div>
  <div><b>${f.title}</b> ${f.job?`<span class="src">· ${jl(f.job)}</span>`:''}<div class="src">${f.deadline}</div><div class="d">${f.detail}</div></div><div class="r"><b class="pos">${f.impact}</b></div></div>`).join('')}
 <div class="note">P1 = before Wednesday's installs · P2 = this week · P3 = habits worth changing. Click any row to expand.</div></div>`}
nav();render();
</script></body></html>
